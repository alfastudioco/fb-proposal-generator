<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB Construction — Past Proposals</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="history-page">
  <header class="history-header">
    <div>
      <h1>FB Construction</h1>
      <p>Past Proposals</p>
    </div>
    <div class="history-header-actions">
      <a class="btn-secondary" href="/clients.html">Clients</a>
      <a class="btn-new" href="/">+ New Proposal</a>
    </div>
  </header>

  <div id="historyStatus" class="history-status"></div>

  <table class="history-table" id="historyTable">
    <thead>
      <tr>
        <th>Proposal #</th>
        <th>Client</th>
        <th>Status</th>
        <th>Date</th>
        <th>Total</th>
        <th>Deposit</th>
        <th>Created</th>
        <th>Files</th>
      </tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>
</div>

<script src="/share.js"></script>
<script src="/proposals.js"></script>
</body>
</html>
